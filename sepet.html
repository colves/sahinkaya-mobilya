<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sepetim - Şahinkaya Ahşap</title>
    <link rel="icon" href="assets/img/mini_logo.png">
    <link rel="apple-touch-icon" href="assets/img/mini_logo.png">
    <link rel="stylesheet" href="css/main.css">

    <script>
        (function(){
            var t = localStorage.getItem('sahinkaya_tema');
            var tema = ''; try { tema = JSON.parse(t); } catch(e) { tema = t; }
            if (tema === 'light') document.documentElement.classList.add('light-mode');
            else document.documentElement.classList.add('dark-mode');
            document.documentElement.style.background = '#0a0a0a';
        })();
    </script>

    <meta property="og:site_name" content="Şahinkaya Mobilya">
    <script type="application/ld+json">
    {
      "@context" : "https://schema.org",
      "@type" : "WebSite",
      "name" : "Şahinkaya Mobilya",
      "url" : "https://sahinkayamobilya.com/"
    }
    </script>
</head>
<body>
<main class="bolum">
    <h2 class="bolum-baslik">Alışveriş Sepetiniz</h2>
    <div class="tablo-kaydir">
        <table class="tasarım-tablo">
            <thead><tr><th>Ürün Adı</th><th>Fiyat</th><th>İşlem</th></tr></thead>
            <tbody id="sepet-tablo-govde"></tbody>
        </table>
    </div>
    <div class="ozet-kutu">
        <div class="ozet-satir"><span>Ara Toplam:</span> <span id="ara-toplam">0 TL</span></div>
        <div class="ozet-satir"><span>KDV (%20):</span> <span id="vergi-tutari">Mevcut fiyata dahildir</span></div>
        <div class="ozet-satir" style="border-top:1px solid var(--kenarlik); padding-top:12px; font-weight:bold;"><span>Genel Toplam:</span> <span id="genel-toplam">0 TL</span></div>
        <button class="btn-satin-al" onclick="siparisiTamamla()">Siparişi Tamamla</button>
    </div>
</main>
