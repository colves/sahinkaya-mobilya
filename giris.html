<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş / Kayıt - Şahinkaya Ahşap</title>
    <link rel="icon" href="assets/img/mini_logo.png">
    <link rel="apple-touch-icon" href="assets/img/mini_logo.png">
    <link rel="stylesheet" href="css/main.css">

    <script>
    (function(){
        var t = localStorage.getItem('sahinkaya_tema');
        var tema = ''; try { tema = JSON.parse(t); } catch(e) { tema = t; }
        if (tema === 'light') document.documentElement.classList.add('light-mode');
        else document.documentElement.classList.add('dark-mode');
        document.documentElement.style.background = '#0a0a0a';
    })();
    </script>

    <meta property="og:site_name" content="Şahinkaya Mobilya">
    <script type="application/ld+json">
    {
      "@context" : "https://schema.org",
      "@type" : "WebSite",
      "name" : "Şahinkaya Mobilya",
      "url" : "https://sahinkayamobilya.com/"
    }
    </script>
</head>
<body>
<!-- Sayfa Baslik Bandi -->
<div class="sayfa-baslik-bandi">
    <img src="assets/img/ana_sayfa_gorselleri/ana_sayfa.png" alt="Hesabım" class="sayfa-baslik-bandi-bg" onerror="this.style.display='none'">
    <div class="sayfa-baslik-bandi-overlay"></div>
    <div class="sayfa-baslik-bandi-icerik">
        <h1>HESABIM</h1>
        <p>Giriş yapın veya yeni hesap oluşturun</p>
    </div>
</div>
<main class="bolum">
    <div class="auth-kapsam">
        <div class="form-kutu" id="giris-kutusu">
            <h3 style="margin-bottom:20px; text-align:center;">GİRİŞ YAP</h3>
            <div class="form-grup"><label>E-Posta</label><input type="email" id="giris-kadi" oninput="this.value = this.value.replace(/\s/g, '')"></div>
            <div class="form-grup"><label>Şifre</label><input type="password" id="giris-sifre" oninput="this.value = this.value.replace(/\s/g, '')" onkeydown="if(event.key === 'Enter') girisYap()"></div>
            <button class="btn-satin-al" onclick="girisYap()">Giriş Yap</button>
            <p class="form-link">Hesabınız yok mu? <a href="javascript:void(0)" onclick="formDegistir('kayit')">Hemen Kaydolun</a></p>
        </div>
        <div class="form-kutu" id="kayit-kutusu" style="display:none;">
            <h3 style="margin-bottom:20px; text-align:center;">KAYIT OL</h3>
            <div class="form-grup"><label>Ad Soyad</label><input type="text" id="kayit-isim"></div>
            <div class="form-grup"><label>E-Posta</label><input type="email" id="kayit-kadi" oninput="this.value = this.value.replace(/\s/g, '')"></div>
            <div class="form-grup"><label>Şifre Belirleyin</label><input type="password" id="kayit-sifre" oninput="this.value = this.value.replace(/\s/g, '')"></div>
            <div class="form-grup"><label>Şifre (Tekrar)</label><input type="password" id="kayit-sifre-tekrar" oninput="this.value = this.value.replace(/\s/g, '')" onkeydown="if(event.key === 'Enter') kayitOl()"></div>
            <button class="btn-satin-al btn-ghost" onclick="kayitOl()">Hesap Oluştur</button>
            <p class="form-link">Zaten bir hesabınız var mı? <a href="javascript:void(0)" onclick="formDegistir('giris')">Giriş Yapın</a></p>
        </div>
    </div>
</main>


    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-init.js"></script>
    
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
<script src="js/shop.js"></script>
<script src="js/projects.js"></script>
<script src="js/products.js"></script>
<script src="js/effects.js"></script>
<script src="js/app.js"></script>
</body>
</html>
